<!doctype html>
<html lang="en" id="root" class="scroll-smooth" %sveltekit.attributes%>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet"
  />
  <link 
    href="https://fonts.googleapis.com/css2?family=DM+Sans&family=Cormorant+Garamond&display=swap" 
    rel="stylesheet" 
  />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/app-icon-180.png" />

  %sveltekit.head%

  <!-- Runs before any CSS renders, eliminates light/dark mode flash -->
  <script>
    (function() {
      const saved = localStorage.getItem('blupodd-theme');
      if (saved === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
</head>
<body class="font-sans bg-chalk text-navy-dark overflow-x-hidden" %sveltekit.body.attributes%>
  <div id="root">%sveltekit.body%</div>
</body>
</html>
